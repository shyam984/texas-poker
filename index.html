  <script>
    setTimeout(function () {
      if (window.__tpBooted) return;
      var t = document.querySelector('.boot-text');
      if (t) t.textContent = 'The game is taking a long time to load. Check your connection and refresh, or try an up-to-date browser like Chrome, Safari or Firefox.';
